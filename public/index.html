<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, shrink-to-fit=no"
		/>
		<title>Desrt.</title>

		<link rel="shortcut icon" content="favicon.webp" />
	
		<script src="/scram/scramjet.all.js"></script>
		<script src="/baremux/index.js"></script>
		
		<link rel="stylesheet" href="index.css" />
		<script src="register-sw.js" defer></script>
		<script src="search.js" defer></script>
		<script src="index.js" defer></script>
	</head>

	<body>
		<!-- Browser-style navigation bar -->
		<div id="sj-nav-bar" class="sj-nav-bar">
			<div class="sj-nav-buttons">
				<button id="sj-home-btn" class="sj-nav-btn" title="Home" type="button">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
						<polyline points="9 22 9 12 15 12 15 22"></polyline>
					</svg>
				</button>
				<button id="sj-back-btn" class="sj-nav-btn" title="Back" type="button">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<path d="M19 12H5M12 19l-7-7 7-7"></path>
					</svg>
				</button>
				<button id="sj-reload-btn" class="sj-nav-btn" title="Reload" type="button">
					<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
						<polyline points="23 4 23 10 17 10"></polyline>
						<path d="M20.49 15a9 9 0 1 1-2-8.83"></path>
					</svg>
				</button>
			</div>
			<div class="sj-url-bar-container">
				<input id="sj-url-display" class="sj-url-display" type="text" readonly value="about:blank" />
			</div>
		</div>

		<div id="sj-main-content" class="sj-main-content">
			<div title="Scramjet Logo" class="flex-center logo-wrapper header-center">
				<img class="logo" src="desrt.svg" alt="Scramjet" />
				<h1>Scramjet | MW</h1>
			</div>
			<div class="flex-center desc left-margin">
				<p>
					Scramjet is an experimental interception based web proxy designed to
					evade internet censorship, bypass arbitrary web browser restrictions and
					innovate web proxy technologies.
				</p>
			</div>

			<form id="sj-form" class="flex-center">
				<input
					id="sj-search-engine"
					value="https://duckduckgo.com/?q=%s"
					type="hidden"
				/>
				<input id="sj-address" type="text" placeholder="Search the web freely" />
			</form>
			<div class="desc left-margin">
				<p id="sj-error"></p>
				<pre id="sj-error-code"></pre>
			</div>
			<footer>
				<div>
					<a
						title="The Mercury Workshop GitHub organization"
						href="https://github.com/MercuryWorkshop"
					>Mercury Workshop</a
					>
					<a
						title="The example demo app for Scramjet"
						href="https://github.com/MercuryWorkshop/Scramjet-Demo"
					>GitHub</a
					>
					<a title="License information" href="credits.html">Credits</a>
				</div>
				<div>
					<span>Scramjet &copy; MW 2025</span>
				</div>
			</footer>
		</div>
	</body>
</html>
