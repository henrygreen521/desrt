<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/png" href="finalfav.png">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desrt Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      min-height: 100%;
      background-color: #21170f;
    }
    body {
      min-height: 100vh;
      font-family: system-ui, sans-serif;
      background: radial-gradient(ellipse at 50% -15%, #76552c 0, #3b2a1a 48%, #21170f 100%);
      color: #ead8b2;
    }
    header {
      padding: 18px 28px;
      border-bottom: 1px solid rgba(224, 177, 92, 0.28);
      background: rgba(31, 22, 14, 0.7);
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 5px 24px rgba(0, 0, 0, 0.2);
    }
    header h1 {
      font-size: 20px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #e5b85c;
    }
    #status {
      font-size: 12px;
      padding: 5px 11px;
      border: 1px solid #80643b;
      border-radius: 999px;
      background: #302317;
      color: #c5a66b;
    }
    #status.ok { color: #c8d28a; background: #34351d; border-color: #777b43; }
    #status.err { color: #f2a07c; background: #3c2118; border-color: #8a4931; }
    #games {
      min-height: calc(100vh - 70px);
      padding: 18px;
      background: #2b1e13;
      color: #ead8b2;
    }
    #games iframe { background: #2b1e13; }
  </style>
</head>
<body>
  <header>
    <h1>Desrt Games</h1>
    <span id="status">connecting...</span>
  </header>

  <div id="games"></div>

  <script src="https://cdn.jsdelivr.net/gh/luminsdk/script@latest/lumin.min.js"></script>
  <script>
    const status = document.getElementById('status');

    Lumin.init({
      container: '#games',
      theme: 'dark',
      columns: 8,
      rows: 4,
      showSearch: true,
      showCategories: false,
      showRandom: false,

      onReady: () => {
        status.textContent = 'connected';
        status.className = 'ok';
      },

      onGameStart: (game) => console.log('Playing:', game.name),
      onGameEnd: () => console.log('Game closed'),

      onError: (err) => {
        status.textContent = err.message;
        status.className = 'err';
      },
    });
  </script>
</body>
</html>
